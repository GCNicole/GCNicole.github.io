<!-- Tarjeta con el resumen de una entrada. Se usa en el inicio y en las categorías -->
<article class="resumen-entrada">

  {% if post.imagen %}
  <a href="{{ post.url }}">
    <img class="miniatura" src="{{ post.imagen }}" alt="{{ post.title }}">
  </a>
  {% endif %}

  <div class="texto-tarjeta">
    <!-- Nombre de la categoría (inversion lo escribimos con tilde para que se vea bien) -->
    <span class="etiqueta-categoria">
      {% if post.category == "inversion" %}Inversión{% else %}{{ post.category }}{% endif %}
    </span>

    <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    <p class="fecha">{{ post.date | date: "%d/%m/%Y" }}</p>
    <p>{{ post.resumen }}</p>
    <a class="leer-mas" href="{{ post.url }}">Leer más</a>
  </div>

</article>
