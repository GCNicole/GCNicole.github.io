<!-- 
Este codigo servirá para hacer las tarjetas con el resumen cada una de las entradas. 
Se usa en el inicio y en las categorías 
-->

<article class="resumen-entrada">  <!-- abrimos la etiqueta clase que llamaremos resumen de la entrada-->

  {% if post.imagen %}     <!-- Con este bloque mostraremos la foto en la tarjeta y si se pulsa se redirige a la entrada -->
  <a href="{{ post.url }}">  <!-- Aqui abre un enlace, que será la foto que meteremos -->
    <img class="miniatura" src="{{ post.imagen }}" alt="{{ post.title }}"> <!-- Es la imagen. -->
  </a>
  {% endif %}

  <div class="texto-tarjeta">  <!-- Como indica el nombre esta parte, es el texto de la tarjeta, que va debajo de la foto-->
    <!-- Aqui irá el nombre de la categoría (inversion lo escribimos con tilde para que se vea bien) -->
    <span class="etiqueta-categoria">
      {% if post.category == "inversion" %}Inversión{% else %}{{ post.category }}{% endif %}
    </span>

    <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
    <p class="fecha">{{ post.date | date: "%d/%m/%Y" }}</p>
    <p>{{ post.resumen }}</p>
    <a class="leer-mas" href="{{ post.url }}">Leer más</a>
  </div>

</article>    <!-- cerramos la etiqueta-->
